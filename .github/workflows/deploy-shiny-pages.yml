name: Deploy forecast site to Pages

# The forecast site is plain static files in shiny/web/ (HTML + JS + JSON data
# written by shiny/export_web_data.R), so there's nothing to build: publish the
# folder as-is.

on:
  push:
    branches: [main]
    paths:
      - "shiny/web/**"
      - ".github/workflows/deploy-shiny-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check web data is present
        run: test -s shiny/web/data/forecast.json && test -s shiny/web/data/tcz.geojson && test -s shiny/web/data/pastoral.geojson

      - uses: actions/upload-pages-artifact@v5
        with:
          path: shiny/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
